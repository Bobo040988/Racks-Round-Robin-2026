<body><div class="wrap">
<header class="hero">
  <h1>RACKS ROUND ROBIN</h1>
  <div class="sub"> • 2026 RANKINGS</div>
  <div class="pool-line"></div>
  <div class="stats"><span class="chip">Scoring: <b>2 × participants + 5 × wins</b></span><span class="chip" id="updatedChip">Updated: <b>—</b></span></div>
</header>

<div id="results"></div>

<script>
const RANKING_ID = 74662318;
const API = "https://api.cuescore.com";
let stopped = false;

const $ = id => document.getElementById(id);
function esc(s){
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;")
                  .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function log(s, cls=""){
  $("status").innerHTML += (cls ? `<span class="${cls}">` : "") +
    esc(s) + (cls ? "</span>" : "") + "\\n";
  $("status").scrollTop = $("status").scrollHeight;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function getJSON(url, tries=3){
  let last;
  for(let i=1;i<=tries;i++){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){
      last=e;
      if(i<tries) await sleep(1000*i);
    }
  }
  throw last;
}

function flattenStandings(standings){
  const out=[];
  if(!standings) return out;
  for(const group of Object.values(standings)){
    if(Array.isArray(group)){
      for(const row of group){
        if(row?.player?.playerId != null) out.push(row);
      }
    }
  }
  return out;
}

/*
 Count wins from ALL finished tournament matches.
 This deliberately does not use standings.wins because the user wants
 group wins + knockout wins. The matches array contains both.
*/
function countAllMatchWins(data){
  const wins = new Map();
  const matches = Array.isArray(data.matches) ? data.matches : [];

  for(const m of matches){
    if(m.matchstatusCode !== 2 && String(m.matchstatus).toLowerCase() !== "finished") continue;

    const a = m.playerA?.playerId;
    const b = m.playerB?.playerId;
    if(a == null || b == null) continue;

    const sa = Number(m.scoreA);
    const sb = Number(m.scoreB);

    if(!Number.isFinite(sa) || !Number.isFinite(sb) || sa === sb) continue;

    const winner = sa > sb ? a : b;
    wins.set(winner, (wins.get(winner)||0) + 1);
  }
  return wins;
}

async function run(){
  stopped=false;
  $("status").textContent="";
  $("results").innerHTML="";

  try{
    log("Loading Racks Round Robin 2026 ranking API...");
    const ranking = await getJSON(`${API}/ranking/?id=${RANKING_ID}`);

    if(!Array.isArray(ranking.tournaments)){
      throw new Error("The ranking API did not return a tournament list.");
    }

    // IMPORTANT:
    // The ranking API is already the official Racks Round Robin event list.
    // Do not filter by UTC weekday: some local Saturday events have Friday UTC dates.
    const now = new Date();
    const tournaments = ranking.tournaments
      .filter(t => /racks round robin/i.test(t.name || ""))
      .filter(t => String(t.status).toLowerCase() !== "upcoming")
      .filter(t => new Date(t.starttime) <= now)
      .sort((a,b)=>new Date(a.starttime)-new Date(b.starttime));

    log(`Found ${tournaments.length} completed/past events in the ranking.`);
    if(tournaments.length !== 38){
      log(`WARNING: Expected 38 past events based on the current 2026 ranking list, but found ${tournaments.length}.`, "err");
    }

    const totals = new Map();
    const winTotals = new Map();
    const rrPlayed = new Map();
    const tournamentWins = new Map();
    const names = new Map();
    const eventAudit = [];
    const failed = [];

    for(let i=0;i<tournaments.length;i++){
      if(stopped){log("Stopped."); return;}

      const t=tournaments[i];
      const localDate = t.starttime.slice(0,10);
      log(`[${i+1}/${tournaments.length}] ${localDate} — tournament ${t.id}`);

      let data;
      try{
        data=await getJSON(`${API}/tournament/?id=${t.id}`, 4);
      }catch(e){
        failed.push({id:t.id,date:localDate,error:String(e)});
        log(`FAILED ${t.id}: ${e}`, "err");
        continue;
      }

      const rows=flattenStandings(data.standings);
      const participantIds=new Set();

      for(const r of rows){
        const id=r.player.playerId;
        participantIds.add(id);
        names.set(id,r.player.name);
        if(!totals.has(id)) totals.set(id,0);
        if(!winTotals.has(id)) winTotals.set(id,0);
        if(!rrPlayed.has(id)) rrPlayed.set(id,0);
        if(!tournamentWins.has(id)) tournamentWins.set(id,0);
      }

      const participants=participantIds.size;
      for(const id of participantIds){
        rrPlayed.set(id,(rrPlayed.get(id)||0)+1);
      }

      // CueScore standings `wins` are the round-robin/group-stage wins.
      // When a knockout stage exists, add each finished knockout match won.
      // This is intentional: in these Racks events the standings `wins`
      // do not include the later knockout matches.
      const wins = new Map();
      for(const r of rows){
        const id=r.player.playerId;
        wins.set(id, Number(r.wins)||0);
      }

      // The matches array is needed for both knockout-win counting and
      // tournament-winner detection, so initialise it BEFORE using it.
      const matches = Array.isArray(data.matches) ? data.matches : [];

      for(const m of matches){
        const code = String(m.roundCode || "").toLowerCase();
        const name = String(m.roundName || "").toLowerCase();
        const isKnockout =
          code.includes("final") || name.includes("final") ||
          code.includes("semi") || name.includes("semi") ||
          code.includes("quarter") || name.includes("quarter") ||
          code.includes("knockout") || name.includes("knockout") ||
          code.includes("last16") || name.includes("last 16") ||
          code.includes("last32") || name.includes("last 32") ||
          code.includes("last64") || name.includes("last 64");

        const sa = Number(m.scoreA), sb = Number(m.scoreB);
        const a = m.playerA?.playerId, b = m.playerB?.playerId;
        const finished = m.matchstatusCode === 2 ||
          String(m.matchstatus || "").toLowerCase() === "finished";

        if(isKnockout && finished && a != null && b != null &&
           Number.isFinite(sa) && Number.isFinite(sb) && sa !== sb){
          const winner = sa > sb ? a : b;
          wins.set(winner, (wins.get(winner)||0) + 1);
        }
      }

      // Count the tournament winner from the API's explicit Final match.
      // CueScore exposes roundCode="final" and roundName="Final".
      let winnerId = null;
      const finalMatches = matches.filter(m => {
        const code = String(m.roundCode || "").toLowerCase();
        const name = String(m.roundName || "").toLowerCase();
        const a = m.playerA?.playerId, b = m.playerB?.playerId;
        const sa = Number(m.scoreA), sb = Number(m.scoreB);
        const finished = m.matchstatusCode === 2 || String(m.matchstatus || "").toLowerCase() === "finished";
        return finished && a != null && b != null && Number.isFinite(sa) && Number.isFinite(sb)
          && sa !== sb && (code === "final" || name === "final");
      });

      if(finalMatches.length){
        // Exactly one tournament win is awarded from the API's explicit final.
        // If duplicate final records exist, only count the final record once.
        const fm = finalMatches[finalMatches.length - 1];
        winnerId = Number(fm.scoreA) > Number(fm.scoreB)
          ? fm.playerA.playerId
          : fm.playerB.playerId;
        tournamentWins.set(winnerId,(tournamentWins.get(winnerId)||0)+1);
        if(!names.has(winnerId)){
          names.set(winnerId, fm.scoreA > fm.scoreB ? fm.playerA.name : fm.playerB.name);
        }
      }

      // Everyone gets the participation component.
      // Each finished match win adds 5.
      for(const id of participantIds){
        const w=wins.get(id)||0;
        const points=(participants*2)+(w*5);
        totals.set(id,(totals.get(id)||0)+points);
        winTotals.set(id,(winTotals.get(id)||0)+w);
      }

      const totalWins=[...wins.values()].reduce((a,b)=>a+b,0);
      eventAudit.push({
        date:data.displayDate || localDate,
        id:t.id,
        participants,
        countedWins:totalWins,
        tournamentWinner: winnerId != null ? (names.get(winnerId)||String(winnerId)) : "NOT FOUND"
      });

      log(`  ${participants} participants | ${totalWins} match wins counted`, "ok");
      await sleep(150);
    }

    const output=[...totals.entries()]
      .map(([id,points])=>({id,name:names.get(id)||String(id),wins:winTotals.get(id)||0,rrPlayed:rrPlayed.get(id)||0,tournamentWins:tournamentWins.get(id)||0,points}))
      .sort((a,b)=>b.points-a.points || a.name.localeCompare(b.name));

    const latestEvent = tournaments.length ? tournaments[tournaments.length-1] : null;
    const latestDate = latestEvent ? new Date(latestEvent.starttime).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const latestLabel = latestEvent ? (latestEvent.name || 'Racks Round Robin') : '—';
    $("updatedChip").innerHTML = `Updated: <b>${esc(latestDate)}</b>`;
    let html=`<div class="card ranking-card"><h3>🏆 Calculated ranking (${eventAudit.length} events processed)</h3>`;
    const missingWinners = eventAudit.filter(x => x.tournamentWinner === "NOT FOUND");
    const detectedWinnerCount = eventAudit.filter(x => x.tournamentWinner !== "NOT FOUND").length;
    if(missingWinners.length){
      html+=`<p class="err"><b>${missingWinners.length} tournament(s) had no final winner detected.</b> Check the Event audit before using Tournament Wins.</p>`;
    } else {
      html+=`<p class="ok"><b>${detectedWinnerCount} tournament winners detected from API Final matches.</b></p>`;
    }
    if(failed.length){
      html+=`<p class="err"><b>${failed.length} event(s) failed.</b> Their points are NOT included. Do not use the ranking until those errors are resolved.</p>`;
    }else{
      html+=`<p class="ok"><b>All ${eventAudit.length} events processed successfully.</b></p>`;
    }

    html+=`<div class="ranking-scroll"><table><thead><tr><th>Pos</th><th>Player</th><th class="num">RRs Played</th><th class="num">Total Wins</th><th class="num">Tournament Wins</th><th class="num">Points</th></tr></thead><tbody>`;

    let pos=0, prev=null;
    output.forEach((p,idx)=>{
      if(prev!==p.points) pos=idx+1;
      const top8 = idx < 8;
      html+=`<tr class="${top8?'top8':''} rank-row" data-rank="${pos}"${idx>=10?' style="display:none"':''}><td>${pos}</td><td>${esc(p.name)}</td><td class="num">${p.rrPlayed}</td><td class="num">${p.wins}</td><td class="num">${p.tournamentWins}</td><td class="num">${p.points}</td></tr>`;
      prev=p.points;
    });
    html+=`</tbody></table></div>
<div class="rank-expand-wrap"><button type="button" id="rankExpandBtn">▼ Show ranks 11+</button></div>
</div>`;

    html+=`<div class="card audit audit-table-card"><h3>Event audit</h3><table><thead><tr><th>Date</th><th>ID</th><th>Participants</th><th>Wins counted</th><th>Tournament Winner</th></tr></thead><tbody>`;
    for(const d of eventAudit){
      html+=`<tr><td>${esc(d.date)}</td><td>${d.id}</td><td>${d.participants}</td><td>${d.countedWins}</td><td>${esc(d.tournamentWinner)}</td></tr>`;
    }
    for(const f of failed){
      html+=`<tr class="err"><td>${esc(f.date)}</td><td>${f.id}</td><td colspan="2">FAILED: ${esc(f.error)}</td></tr>`;
    }
    html+=`</tbody></table></div>`;

    html+=`<button class="audit-toggle" id="auditToggle" type="button">📋 View Event Audit & Calculation Log</button>
      <div class="audit-drawer" id="auditDrawer">
        <div class="card">
          <h3>Calculation Log</h3>
          <div class="audit-log" id="auditLog"></div>
        </div>
        <div id="auditTableCopy"></div>
      </div>`;

    $("results").innerHTML=html;

    const rankExpandBtn = $("rankExpandBtn");
    if(rankExpandBtn){
      let expanded = false;
      rankExpandBtn.onclick = () => {
        expanded = !expanded;
        $("results").querySelectorAll(".rank-row").forEach(row => {
          const rank = Number(row.dataset.rank);
          if(rank > 10) row.style.display = expanded ? "table-row" : "none";
        });
        rankExpandBtn.textContent = expanded ? "▲ Hide ranks 11+" : "▼ Show ranks 11+";
      };
    }

    const auditTable = $("results").querySelector(".audit-table-card");
    const auditTableCopy = $("auditTableCopy");
    if(auditTable && auditTableCopy){
      auditTableCopy.appendChild(auditTable);
    }
    const auditToggle = $("auditToggle");
    const auditDrawer = $("auditDrawer");
    if(auditToggle && auditDrawer){
      auditToggle.onclick=()=>{
        const open=auditDrawer.classList.toggle("open");
        auditToggle.textContent=open ? "▲ Hide Event Audit & Calculation Log" : "📋 View Event Audit & Calculation Log";
        const logBox=$("auditLog");
        if(logBox) logBox.innerHTML=$("status").innerHTML || "No calculation log yet.";
      };
    }

    const csvRows=["Position,Player,RRs Played,Total Wins,Tournament Wins,Points"];
    let prevPts=null, competitionPos=0;
    output.forEach((p,idx)=>{
      if(prevPts!==p.points) competitionPos=idx+1;
      csvRows.push(`${competitionPos},"${p.name.replaceAll('"','""')}",${p.rrPlayed},${p.wins},${p.tournamentWins},${p.points}`);
      prevPts=p.points;
    });
    const blob=new Blob([csvRows.join("\\n")],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Racks_Round_Robin_2026_corrected_ranking.csv";
    a.textContent="Download CSV";
    a.style.display="inline-block";
    a.style.marginTop="12px";
    $("results").prepend(a);

    log(failed.length ? "Finished with errors — do NOT use the ranking yet." : "DONE — all events processed.", failed.length ? "err" : "ok");

  }catch(e){
    log("ERROR: "+e, "err");
  }
}

$("run").onclick=run;
$("stop").onclick=()=>{stopped=true;};
</script>

<script id="pool-loading-script">
(function(){
  const overlay=document.getElementById('poolLoadingOverlay');
  const text=document.getElementById('poolLoadingText');
  const runBtn=document.getElementById('run');
  const stopBtn=null;
  if(!overlay || !runBtn) return;

  const messages=[
    "Breaking the data, one 8-ball at a time.",
    "Checking the racks… 🎱",
    "Counting the wins — no dodgy handicaps!",
    "Shuffling the balls, not the results.",
    "Looking for those knockout wins…",
    "Almost down to the black…"
  ];
  let timer=null, observer=null;

  function showLoading(){
    overlay.classList.add('show');
    let i=0;
    text.textContent=messages[i];
    clearInterval(timer);
    timer=setInterval(()=>{
      i=(i+1)%messages.length;
      text.textContent=messages[i];
    },1100);
  }
  function hideLoading(){
    overlay.classList.remove('show');
    clearInterval(timer);
  }

  runBtn.addEventListener('click',()=>{
    showLoading();
    if(!observer){
      observer=new MutationObserver(()=>{
        const t=document.body.innerText||"";
        if(/DONE — all events processed|Finished with errors|All \d+ events processed successfully/i.test(t)){
          setTimeout(hideLoading,300);
        }
      });
      observer.observe(document.body,{subtree:true,childList:true,characterData:true});
    }
  });
  
})();
</script>

<script id="mobile-proper-frozen-columns-js">
(function(){
  function rebuildFixedPane(){
    if(window.innerWidth>700) return;
    document.querySelectorAll('.ranking-card .ranking-scroll').forEach(function(sc){
      var table=sc.querySelector('table');
      if(!table) return;
      var old=sc.querySelector('.mobile-fixed-pane');
      if(old) old.remove();
      var pane=document.createElement('div');
      pane.className='mobile-fixed-pane';
      var head=table.querySelector('thead tr');
      if(head){
        var r=document.createElement('div'); r.className='mfp-row mfp-head';
        [0,1].forEach(function(i){var c=document.createElement('div');c.className='mfp-cell';c.textContent=head.children[i]?.textContent||'';r.appendChild(c);});
        pane.appendChild(r);
      }
      var rows=[...table.querySelectorAll('tbody tr')].filter(function(r){return getComputedStyle(r).display!=='none';});
      rows.forEach(function(row){
        var r=document.createElement('div');r.className='mfp-row'+(row.classList.contains('top8')?' mfp-top8':'');
        [0,1].forEach(function(i){var c=document.createElement('div');c.className='mfp-cell';c.textContent=row.children[i]?.textContent||'';r.appendChild(c);});
        pane.appendChild(r);
      });
      sc.appendChild(pane);
      syncHeights(sc,pane);
    });
  }
  function syncHeights(sc,pane){
    var table=sc.querySelector('table');
    var trs=[table.querySelector('thead tr'),...table.querySelectorAll('tbody tr')].filter(Boolean).filter(function(r){return getComputedStyle(r).display!=='none';});
    var mrows=[...pane.querySelectorAll('.mfp-row')];
    trs.forEach(function(tr,i){ if(mrows[i]) mrows[i].style.height=tr.getBoundingClientRect().height+'px'; });
  }
  function schedule(){requestAnimationFrame(function(){rebuildFixedPane();});}
  document.addEventListener('DOMContentLoaded',schedule);
  window.addEventListener('resize',schedule);
  var mo=new MutationObserver(function(){if(window.innerWidth<=700) schedule();});
  document.addEventListener('DOMContentLoaded',function(){
    var target=document.querySelector('.ranking-card')||document.body;
    mo.observe(target,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
  });
})();
</script>
